name: kultivia
description: "KultivIA : diagnostic IA des maladies de cultures, par photo, texte et voix."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  # État de l'app
  provider: ^6.1.2

  # Photo pour le diagnostic + photo de profil
  image_picker: ^1.1.2

  # Auth + BDD (à activer après `flutterfire configure`)
  firebase_core: ^3.6.0
  cloud_functions: ^5.1.4
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  geolocator: ^13.0.1
  geoflutterfire_plus: ^0.0.31
  firebase_messaging: ^15.1.3
   # notifications push

  # Supabase
  supabase_flutter: ^2.8.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Liens externes
  url_launcher: ^6.3.1

  # Requêtes HTTP (météo)
  http: ^1.2.2

  # Vocal — reconnaissance et synthèse embarquées (pas de clé requise)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0

  # Vocal cloud (wolof) — enregistrement du micro et lecture de l'audio
  # renvoyé par RodiumAI (voir voice_service.dart)
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Stockage Firebase (photos de profil)
  firebase_storage: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - .env

# flutter_launcher_icons : générez l'icône avec `dart run flutter_launcher_icons`
# après avoir déposé votre logo dans assets/icon/icon.png (1024x1024).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
